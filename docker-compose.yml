# One-command local stack: PostgreSQL + prediction service + backend (with the C++ engine).
#   JWT_SECRET=$(openssl rand -base64 48) docker compose up --build
# STATUS: written, NOT run by the author (no Docker in the authoring environment).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: localpw, POSTGRES_DB: smartbill }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20 }
  prediction:
    build: ./prediction-service
    environment: { PREDICTION_SERVICE_TOKEN: local-dev-token }
    ports: ["8000:8000"]
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on: { db: { condition: service_healthy }, prediction: { condition: service_started } }
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/smartbill
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: localpw
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (min 32 chars)}
      FRONTEND_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"                 # local http only
      PREDICTION_SERVICE_URL: http://prediction:8000
      PREDICTION_SERVICE_TOKEN: local-dev-token
      APP_DEMO_ENABLED: ${APP_DEMO_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports: ["8080:8080"]
