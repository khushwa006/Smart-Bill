# Render Blueprint: two services. Create with "New > Blueprint" and point at this repo.
# STATUS: written, NOT deployed or validated by the author. Secrets are marked sync:false: you enter them in the dashboard.
services:
  - type: web
    name: smartbill-prediction
    runtime: python
    rootDir: prediction-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PREDICTION_SERVICE_TOKEN
        sync: false            # generate: openssl rand -hex 32  (same value goes into the backend)
      - key: PYTHON_VERSION
        value: 3.12.3

  - type: web
    name: smartbill-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .           # repo root: the image also needs database/migrations and native-engine/
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false            # jdbc:postgresql://<pooled-host>.neon.tech/<db>?sslmode=require
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false            # openssl rand -base64 48
      - key: FRONTEND_ORIGIN
        sync: false            # https://<your-app>.vercel.app
      - key: PREDICTION_SERVICE_URL
        sync: false            # https://smartbill-prediction.onrender.com
      - key: PREDICTION_SERVICE_TOKEN
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: COOKIE_SECURE
        value: "true"
      - key: SWAGGER_ENABLED
        value: "false"
